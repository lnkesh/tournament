<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sunday Tournament</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0B0B1E; color:#fff;
  font-family:'Segoe UI',sans-serif;
  padding:20px; min-height:100vh;
}
h1 { color:#00f3ff; text-align:center; text-shadow:0 0 10px #00f3ff; margin-bottom:4px; }
.subtitle { text-align:center; color:#888; font-size:0.85rem; margin-bottom:18px; }
.stats-card {
  background:#1a1a3e; border:1px solid #00f3ff44;
  border-radius:14px; padding:18px; margin-bottom:18px; text-align:center;
}
.big { font-size:2.5rem; color:#00ff66; font-weight:bold; }
.label { color:#888; font-size:0.85rem; margin-top:4px; }
.progress-bar { background:#333; border-radius:50px; height:12px; margin:12px 0; overflow:hidden; }
.progress-fill {
  height:100%; border-radius:50px;
  background:linear-gradient(90deg,#00f3ff,#00ff66); transition:width 0.5s;
}

/* ── Monetag Ad Container ── */
.ad-container {
  background:#111133;
  border:1px solid #00f3ff22;
  border-radius:12px;
  padding:10px;
  margin-bottom:15px;
  text-align:center;
  min-height:80px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.ad-label {
  color:#555; font-size:0.7rem;
  margin-bottom:6px;
  text-transform:uppercase;
  letter-spacing:1px;
}

#adBtn {
  width:100%; background:linear-gradient(135deg,#00f3ff,#00ff66);
  color:#0B0B1E; border:none; padding:16px;
  font-size:1.1rem; font-weight:bold;
  border-radius:12px; cursor:pointer;
  margin-bottom:10px; box-shadow:0 0 20px #00f3ff44;
}
#adBtn:disabled { background:#333; color:#666; box-shadow:none; cursor:not-allowed; }
#unlockBtn {
  width:100%; background:linear-gradient(135deg,#ff4d4d,#ff8800);
  color:#fff; border:none; padding:15px;
  font-size:1rem; font-weight:bold;
  border-radius:12px; cursor:pointer;
  margin-bottom:15px; display:none;
}
.leaderboard { margin-top:20px; }
.leaderboard h2 { color:#00f3ff; margin-bottom:12px; font-size:1.1rem; }
.lb-item {
  display:flex; align-items:center;
  background:#1a1a3e; border-radius:10px;
  padding:12px 15px; margin-bottom:8px;
  border:1px solid #ffffff11;
}
.rank-1 { border-color:#ffd70066; }
.rank-2 { border-color:#c0c0c066; }
.rank-3 { border-color:#cd7f3266; }
.lb-rank { font-size:1.3rem; width:38px; }
.lb-name { flex:1; color:#fff; font-size:0.95rem; }
.lb-ads { color:#00ff66; font-weight:bold; }
.timer { text-align:center; color:#ff4d4d; font-size:0.85rem; margin-bottom:10px; }
</style>
</head>
<body>

<h1>🏆 Sunday Tournament</h1>
<p class="subtitle">Watch ads • Climb leaderboard • Win 1000 coins!</p>

<!-- Stats Card -->
<div class="stats-card">
  <div class="big" id="adsCount">0</div>
  <div class="label">Ads Watched Today</div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="label">Free limit: <span id="limitText">0/20</span> | Ends at 11:59 PM</div>
</div>

<!--
  ════════════════════════════════════════
  MONETAG AD SECTION
  Apna Monetag script tag yahan paste karo.
  Example niche diya hai — apna actual code daalo.
  ════════════════════════════════════════
-->
<div class="ad-container">
  <div class="ad-label">Sponsored</div>

  <!-- 
    YAHAN APNA MONETAG SCRIPT TAG PASTE KARO
    Example:
    <script type="text/javascript">
      atOptions = {
        'key' : 'TUMHARA_KEY_YAHAN',
        'format' : 'iframe',
        'height' : 60,
        'width' : 468,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="//MONETAG_DOMAIN/TUMHARA_KEY/invoke.js"></script>
  -->

</div>

<!-- Watch Ad Button -->
<button id="adBtn" onclick="watchAd()">📺 Watch Ad & Earn Point</button>

<!-- Unlock Unlimited Button (shows after 20 ads) -->
<button id="unlockBtn" onclick="unlockUnlimited()">
  🔥 Unlock Unlimited Ads — Complete Offer
</button>

<!-- Leaderboard -->
<div class="leaderboard">
  <h2>🏅 Live Leaderboard — Top 10</h2>
  <div id="leaderboardList">
    <div style="color:#666;text-align:center;padding:20px">Loading...</div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────
const BACKEND_URL = "YAHAN_APNA_BACKEND_URL_DAALO";
const CPAGRIP_URL = "YAHAN_APNA_CPAGRIP_URL_DAALO";

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let userAdsCount = 0;
let isUnlocked = false;
let adWatchTimer = null;

// ── LOAD USER DATA ───────────────────────
async function loadData() {
  try {
    const res = await fetch(`${BACKEND_URL}/api/user-info`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: tg.initData }),
    });
    const data = await res.json();
    userAdsCount = data.sundayAdsCount || 0;
    isUnlocked = data.hasUnlockedUnlimitedSunday || false;
    updateUI();
  } catch (e) {
    console.error("Load error:", e);
  }
  loadLeaderboard();
}

// ── UPDATE UI ────────────────────────────
function updateUI() {
  document.getElementById("adsCount").textContent = userAdsCount;
  const pct = Math.min((userAdsCount / 20) * 100, 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("limitText").textContent =
    `${Math.min(userAdsCount, 20)}/20`;

  const adBtn = document.getElementById("adBtn");
  const unlockBtn = document.getElementById("unlockBtn");

  if (userAdsCount >= 20 && !isUnlocked) {
    adBtn.disabled = true;
    adBtn.textContent = "📺 Free Limit Reached";
    unlockBtn.style.display = "block";
  } else {
    adBtn.disabled = false;
    adBtn.textContent = "📺 Watch Ad & Earn Point";
    unlockBtn.style.display = "none";
  }
}

// ── WATCH AD ─────────────────────────────
async function watchAd() {
  const btn = document.getElementById("adBtn");
  btn.disabled = true;

  // 5 second countdown (simulates ad watch time)
  for (let i = 5; i > 0; i--) {
    btn.textContent = `⏳ Watching ad... ${i}s`;
    await new Promise(r => setTimeout(r, 1000));
  }

  btn.textContent = "⌛ Registering...";

  try {
    const res = await fetch(`${BACKEND_URL}/api/tournament/watch-ad`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: tg.initData }),
    });
    const data = await res.json();

    if (data.success) {
      userAdsCount = data.adsCount;
      updateUI();
      loadLeaderboard();
      tg.showAlert(`✅ Ad watched!\n📺 Total: ${userAdsCount} ads`);
    } else if (data.requireUnlock) {
      document.getElementById("unlockBtn").style.display = "block";
      tg.showAlert("🛑 Free limit reached!\nComplete the offer to watch unlimited ads.");
    } else {
      tg.showAlert(data.error || "Something went wrong. Try again.");
      btn.disabled = false;
    }
  } catch (e) {
    tg.showAlert("Connection error. Please try again.");
    btn.disabled = false;
  }

  updateUI();
}

// ── UNLOCK UNLIMITED ─────────────────────
function unlockUnlimited() {
  window.open(CPAGRIP_URL, "_blank");
  tg.showAlert(
    "Complete the offer in the browser, then come back and tap the button below to verify."
  );
  // Show verify button after CPA redirect
  const unlockBtn = document.getElementById("unlockBtn");
  unlockBtn.textContent = "✅ I Completed the Offer — Verify Now";
  unlockBtn.onclick = verifyUnlock;
}

async function verifyUnlock() {
  try {
    const res = await fetch(`${BACKEND_URL}/api/tournament/unlock`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: tg.initData }),
    });
    const data = await res.json();
    if (data.success) {
      isUnlocked = true;
      updateUI();
      tg.showAlert("🔥 Unlimited ads unlocked! Watch as many as you want!");
    }
  } catch (e) {
    tg.showAlert("Verification failed. Try again.");
  }
}

// ── LEADERBOARD ───────────────────────────
async function loadLeaderboard() {
  try {
    const res = await fetch(`${BACKEND_URL}/api/leaderboard`);
    const data = await res.json();
    const container = document.getElementById("leaderboardList");

    if (!data.length) {
      container.innerHTML =
        '<div style="color:#666;text-align:center;padding:20px">No entries yet. Be the first! 🏆</div>';
      return;
    }

    const medals = ["🥇", "🥈", "🥉"];
    container.innerHTML = data.map((u, i) => `
      <div class="lb-item ${i < 3 ? 'rank-' + (i+1) : ''}">
        <div class="lb-rank">${medals[i] || "#" + (i + 1)}</div>
        <div class="lb-name">${u.username ? "@" + u.username : u.fullName || "Anonymous"}</div>
        <div class="lb-ads">${u.sundayAdsCount} ads</div>
      </div>
    `).join("");
  } catch (e) {}
}

// Auto refresh leaderboard every 30 seconds
setInterval(loadLeaderboard, 30000);

// Init
loadData();
</script>
</body>
</html>
